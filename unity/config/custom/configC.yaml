behaviors:

  SoccerTwos:
    trainer_type: poca
    hyperparameters:
      batch_size: 4096           # larger batch for lower gradient variance
      buffer_size: 40960
      learning_rate: 0.0002      # slightly lower lr with larger batch
      beta: 0.01                 # stronger entropy regularization
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3              # deeper network for more complex policies
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 10
    max_steps: 60000000
    time_horizon: 1000
    summary_freq: 20000

    self_play:
      save_steps: 100000         # save less frequently but more diverse opponents
      team_change: 300000
      swap_steps: 8000
      window: 15                 # larger opponent window
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
