behaviors:

  SoccerTwos:
    trainer_type: poca
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0005
      beta: 0.005
      epsilon: 0.2
      lambd: 0.9
      num_epoch: 4
      learning_rate_schedule: constant

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.98
        strength: 1.0

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 512
    summary_freq: 10000

    self_play:
      save_steps: 30000
      team_change: 150000
      swap_steps: 4000
      window: 10
      play_against_latest_model_ratio: 0.6
      initial_elo: 1200.0
