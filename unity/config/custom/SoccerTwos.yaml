#RUN1 and RUN2
behaviors:
  SoccerTwos:
    trainer_type: poca
    hyperparameters:
      batch_size: 3048
      buffer_size: 30480
      learning_rate: 0.0005
      beta: 0.001
      epsilon: 0.1
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 1000000
    time_horizon: 1000
    summary_freq: 10000
    self_play:
      save_steps: 10000
      team_change: 50000
      swap_steps: 1000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
