behaviors:
  Hallway:
    trainer_type: sac
    hyperparameters:
      learning_rate: 0.0001
      learning_rate_schedule: linear
      batch_size: 1024
      buffer_size: 500000
      buffer_init_steps: 0
      tau: 0.01
      steps_per_update: 20.0
      save_replay_buffer: false
      init_entcoef: 0.01
      reward_signal_steps_per_update: 20.0
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 4000000
    time_horizon: 64
    summary_freq: 10000
